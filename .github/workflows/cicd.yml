name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test


  deploy:
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    environment: deployment
    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3

        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          API_PORT: ${{ secrets.API_PORT }}
          NODE_ENV: production
          GH_PAT: ${{ secrets.GH_PAT }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          envs: DB_HOST,DB_PORT,DB_USERNAME,DB_PASSWORD,DB_DATABASE,API_PORT,NODE_ENV,GH_PAT

          script: |
           echo "SSH connection successful"
           hostname
           whoami
           
           set -e

           echo "================================"
           echo "Starting deployment"
           echo "================================"

            mkdir -p ~/app
           cd ~/app

           if [ -d ".git" ]; then
           echo "Updating repository..."

           git fetch origin
           git reset --hard origin/main

           else
           echo "Cloning repository..."

           git clone https://${GH_PAT}@github.com/${{ github.repository }}.git .
           fi

           echo "Creating production .env..."

           cat > .env <<EOF
           DB_HOST=${DB_HOST}
           DB_PORT=${DB_PORT}
           DB_USERNAME=${DB_USERNAME}
           DB_PASSWORD=${DB_PASSWORD}
           DB_DATABASE=${DB_DATABASE}
           API_PORT=${API_PORT}
           NODE_ENV=${NODE_ENV}
           EOF

           chmod 600 .env

           echo "Building Docker image..."

           docker build -t nestjs-app:latest .

           echo "Running database migrations..."

           docker run --rm \
           --env-file .env \
           nestjs-app:latest \
           npm run migration:run

            echo "Stopping old container..."

           docker stop app-container || true
           docker rm app-container || true

           echo "Starting new container..."

           docker run -d \
           --name app-container \
           --restart always \
           -p 80:5000 \
           --env-file .env \
           nestjs-app:latest

           echo "Waiting for application..."

           sleep 10

           echo "Checking container..."

           docker ps

           echo "Application logs..."

           docker logs --tail=50 app-container

           echo "Cleaning unused images..."

           docker image prune -f

           echo "================================"
           echo "Deployment completed successfully!"
           echo "================================"

           
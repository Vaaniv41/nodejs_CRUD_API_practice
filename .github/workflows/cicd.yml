name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Navigate to app directory (Create if first run)
            mkdir -p ~/app && cd ~/app

            # 2. Pull latest code using GitHub Personal Access Token (for private repos)
            if [ -d ".git" ]; then
              git pull https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git main
            else
              git clone https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git .
            fi

            # 3. Step into application directory (Adjust if your Dockerfile is in nestjs-crud-api)
            if [ -d "nestjs-crud-api" ]; then cd nestjs-crud-api; fi

            # 4. Build the new Docker image FIRST (keeps old app online during build)
            docker build -t nestjs-app:latest .

            # 5. Run Database Migrations against RDS
            docker run --rm \
              --env-file /home/${{ secrets.EC2_USERNAME }}/.env \
              nestjs-app:latest npm run migration:run || true

            # 6. Swap containers with minimal downtime
            docker stop app-container || true
            docker rm app-container || true

            docker run -d \
              --name app-container \
              --restart always \
              -p 80:3000 \
              --env-file /home/${{ secrets.EC2_USERNAME }}/.env \
              nestjs-app:latest

            # 7. Clean up unused build cache and old images
            docker image prune -f